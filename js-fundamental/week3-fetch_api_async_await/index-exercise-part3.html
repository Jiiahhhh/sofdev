<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise Part 3</title>
  </head>
  <body>
    <input type="number" id="userId" placeholder="Input ID (1-10)" />
    <button id="btnSearch">Find User</button>
    <div id="result"></div>
  </body>

  <script>
    const btnSearch = document.getElementById("btnSearch");
    const result = document.getElementById("result");

    btnSearch.addEventListener("click", async () => {
      const userId = document.getElementById("userId").value;

      if (!userId) {
        result.innerHTML = `<p>Input UserID!</p>`;
        return;
      }

      result.innerHTML = `<p>Loading...</p>`;
      try {
        const response = await fetch(
          `https://jsonplaceholder.typicode.com/users/${userId}`,
        );
        if (!response.ok) throw new Error(`UserID: ${userId} not found!`);

        const user = await response.json();
        result.innerHTML = `
            <div>
                <h1>Name: ${user.name}</h1>
                <p>Email: ${user.email}</p>
                <p>City: ${user.address.city}</p>
            </div>
        `;
      } catch (error) {
        result.innerHTML = `<p>UserID not found</p>`;
      }
    });
  </script>
</html>
