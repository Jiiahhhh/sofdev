<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Admin Panel</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="d-flex">
      <!-- Sidebar -->
      <aside class="sidebar bg-dark text-white p-3">
        <h4 class="mb-4">🎮 Admin</h4>
        <ul class="nav flex-column gap-2">
          <li>
            <a href="#" class="nav-link text-white"
              ><i class="bi bi-speedometer2"></i> Dashboard</a
            >
          </li>
          <li>
            <a href="#" class="nav-link text-white"
              ><i class="bi bi-controller"></i> Games</a
            >
          </li>
          <li>
            <a href="#" class="nav-link text-white"
              ><i class="bi bi-newspaper"></i> Articles</a
            >
          </li>
          <li>
            <a href="#" class="nav-link text-white"
              ><i class="bi bi-people"></i> Users</a
            >
          </li>
        </ul>
      </aside>

      <!-- Main Content -->
      <main class="flex-grow-1 p-4">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h2 class="mb-0">Game Management</h2>
            <small class="text-muted">Manage your game catalog</small>
          </div>
          <div>
            <button class="btn btn-primary" id="btnOpenModal">
              <i class="bi bi-plus-lg"></i> Add Game
            </button>
          </div>
        </div>

        <!-- Card -->
        <div class="card shadow-sm">
          <div class="card-body">
            <!-- Top Actions -->
            <div class="d-flex gap-2 mb-3 align-items-center">
              <div class="input-group mb-3">
                <input
                  type="text"
                  class="form-control"
                  id="searchGame"
                  placeholder="Search game..."
                />

                <button class="btn btn-outline-secondary">
                  <i class="bi bi-funnel"></i> Filter
                </button>
              </div>
            </div>

            <!-- Table -->
            <div class="table-responsive">
              <table class="table align-middle">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Game Name</th>
                    <th>Genre</th>
                    <th>Status</th>
                    <th>Release Date</th>
                    <th class="text-end">Action</th>
                  </tr>
                </thead>
                <tbody id="gameTableBody">
                  <tr>
                    <td>1</td>
                    <td>Hades</td>
                    <td>Roguelike</td>
                    <td>
                      <span class="badge text-bg-success">Published</span>
                    </td>
                    <td>2024-01-10</td>
                    <td class="text-end">
                      <button class="btn btn-sm btn-outline-primary btn-edit">
                        Edit
                      </button>
                      <button class="btn btn-sm btn-outline-danger">
                        Delete
                      </button>
                    </td>
                  </tr>
                  <tr>
                    <td>2</td>
                    <td>Celeste</td>
                    <td>Platformer</td>
                    <td>
                      <span class="badge text-bg-warning">Draft</span>
                    </td>
                    <td>2024-02-15</td>
                    <td class="text-end">
                      <button class="btn btn-sm btn-outline-primary btn-edit">
                        Edit
                      </button>
                      <button class="btn btn-sm btn-outline-danger">
                        Delete
                      </button>
                    </td>
                  </tr>
                  <tr>
                    <td>3</td>
                    <td>Stardew Valley</td>
                    <td>Simulation</td>
                    <td>
                      <span class="badge text-bg-secondary">Archived</span>
                    </td>
                    <td>2024-03-01</td>
                    <td class="text-end">
                      <button class="btn btn-sm btn-outline-primary btn-edit">
                        Edit
                      </button>
                      <button class="btn btn-sm btn-outline-danger">
                        Delete
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div class="modal fade" id="gameModal" tabindex="=-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Add New Game</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Game Name</label>
              <input type="text" class="form-control" id="gameName" />
            </div>
            <div class="mb-3">
              <label class="form-label">Genre</label>
              <input type="text" class="form-control" id="gameGenre" />
            </div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button class="btn btn-primary" id="btnSaveGame">Save Game</button>
          </div>
        </div>
      </div>
    </div>

    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>

    <!-- Custom JS -->
    <script src="app.js"></script>
    <script src="tes.js"></script>
  </body>
</html>
