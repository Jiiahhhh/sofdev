<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataTables Practice</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/2.3.8/css/dataTables.dataTables.min.css"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h3>Game List</h3>
      <table id="gameTable" class="table table-bordered table-striped">
        <thead>
          <tr>
            <th>Title</th>
            <th>Genre</th>
            <th>Rating</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Elden Ring</td>
            <td>RPG</td>
            <td>9.5</td>
          </tr>
          <tr>
            <td>FIFA 26</td>
            <td>Sport</td>
            <td>7.2</td>
          </tr>
          <tr>
            <td>Cyberpunk 2077</td>
            <td>RPG</td>
            <td>8.1</td>
          </tr>
          <tr>
            <td>Minecraft</td>
            <td>Sandbox</td>
            <td>9.0</td>
          </tr>
          <tr>
            <td>Call of Duty</td>
            <td>FPS</td>
            <td>7.8</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- DataTables JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/datatables/1.10.21/js/jquery.dataTables.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/datatables.net-bs5/2.3.4/dataTables.bootstrap5.min.js"></script>

    <script>
      $(document).ready(function () {
        $("#gameTable").DataTable();
      });
    </script>
  </body>
</html>
